version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://172.24.132.184:27017/library_new
      - PORT=5001
      - NODE_ENV=development
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    network_mode: "host"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE=http://34.229.72.128:5001/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
