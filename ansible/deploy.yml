- hosts: webservers
  become: yes
  vars:
    project_dir: /opt/library_app
    docker_registry_user: "{{ lookup('env', 'DOCKER_USER') }}"
    docker_registry_pass: "{{ lookup('env', 'DOCKER_PASS') }}"

  tasks:
    - name: Wait for instance to be ready
      wait_for_connection:
        delay: 30
        timeout: 300

    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'
        owner: ec2-user
        group: ec2-user

    - name: Copy production docker-compose file to server
      copy:
        src: ../docker-compose.prod.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ec2-user
        group: ec2-user

    - name: Login to Docker Hub
      shell: "echo {{ docker_registry_pass }} | docker login -u {{ docker_registry_user }} --password-stdin"
      become_user: ec2-user

    - name: Pull latest images
      command: docker compose pull
      args:
        chdir: "{{ project_dir }}"
      environment:
        DOCKER_USER: "{{ docker_registry_user }}"

    - name: Restart containers (Deploy)
      command: docker compose up -d
      args:
        chdir: "{{ project_dir }}"
      environment:
        DOCKER_USER: "{{ docker_registry_user }}"
