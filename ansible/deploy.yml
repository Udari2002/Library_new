- hosts: webservers
  become: yes
  vars:
    project_dir: /opt/library_app
    # These will be passed from Jenkins extra-vars
    docker_user: "{{ DOCKER_USER }}"
    docker_pass: "{{ DOCKER_PASS }}"

  tasks:
    - name: Wait for instance to be ready
      wait_for_connection:
        timeout: 300

    # --- PROVISIONING: INSTALL DOCKER ---
    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    # --- DEPLOYMENT: SETUP APP ---
    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Copy production docker-compose file
      copy:
        src: ../docker-compose.prod.yml
        dest: "{{ project_dir }}/docker-compose.yml"

    - name: Login to Docker Hub
      shell: "echo {{ docker_pass }} | docker login -u {{ docker_user }} --password-stdin"
      become_user: ec2-user

    - name: Deploy application
      shell: "/usr/local/bin/docker-compose up -d"
      args:
        chdir: "{{ project_dir }}"
      environment:
        DOCKER_USER: "{{ docker_user }}"
      become_user: ec2-user