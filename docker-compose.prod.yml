version: '3.8'

services:
  backend:
    image: ${DOCKER_USER}/library-backend:latest
    restart: always  # Always restart if container stops
    environment:
      - MONGO_URI=mongodb+srv://moksha_04:MOKsha0401@cluster0.fdr5dae.mongodb.net/library_new?appName=Cluster0
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=your_super_secret_jwt_key_here_change_this_in_production
    ports:
      - "5001:5001"
    healthcheck:
      test: curl -f http://localhost:5001/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKER_USER}/library-frontend:latest
    restart: always  # Always restart if container stops
    environment:
      - VITE_API_BASE=http://13.61.138.122:5001/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3